x-app: &app
  build: .
  image: moneyprinter:latest
  env_file: .env
  environment:
    OLLAMA_BASE_URL: http://ollama:11434
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moneyprinter}:${POSTGRES_PASSWORD:-moneyprinter}@postgres:5432/${POSTGRES_DB:-moneyprinter}
    IMAGEMAGICK_BINARY: /usr/bin/convert
    YOUTUBE_CLIENT_SECRETS_FILE: /app/secrets/client_secret.json
    YOUTUBE_TOKEN_FILE: /app/secrets/youtube_token.json
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneyprinter}
      POSTGRES_USER: ${POSTGRES_USER:-moneyprinter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneyprinter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneyprinter} -d ${POSTGRES_DB:-moneyprinter}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama-init:
    image: ollama/ollama
    entrypoint: ["sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: python Backend/main.py
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Songs:/app/Songs
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/topics', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: python Backend/worker.py
    volumes:
      - ./output:/app/output
      - ./Songs:/app/Songs
      - ./secrets:/app/secrets
    depends_on:
      api:
        condition: service_healthy

  autopilot:
    <<: *app
    command: python Backend/autopilot.py
    volumes:
      - ./output:/app/output
      # Read-only on purpose. The daily metrics refresh needs the OAuth token,
      # but only the worker should ever rewrite it: load_credentials persists a
      # refreshed token, and two processes writing the same file could truncate
      # it and take uploads down. A failed write here is already handled as a
      # warning, so autopilot refreshes in memory and carries on.
      - ./secrets:/app/secrets:ro
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: .
    image: moneyprinter:latest
    command: python -m http.server 8001 --directory Frontend
    ports:
      - "127.0.0.1:8001:8001"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  ollama_models:
